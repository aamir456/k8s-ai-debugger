<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="760" viewBox="0 0 1210 760" role="img" aria-label="Claude Code starts the kubernetes-mcp-server container over stdio. The container calls the Kubernetes API with a read-only ServiceAccount token and queries Prometheus and Alertmanager over NodePorts. The browser reaches the app and Grafana through Envoy on localhost:8080. Prometheus scrapes the app and exporters and fires alerts to Alertmanager.">
        
<style>
  .bg { fill: #f5f7f8; }
  .panel { fill: #eaeef2; }
  .group { fill: none; stroke: #7d8898; stroke-dasharray: 5 4; }
  .box { fill: #ffffff; stroke: #7d8898; stroke-width: 1.2; }
  .box-accent { fill: #dcf1ed; stroke: #0b7a6a; stroke-width: 2; }
  .t { fill: #17202b; font: 600 14px "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .s { fill: #586474; font: 11.5px "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .k { fill: #586474; font: 11px Consolas, "JetBrains Mono", monospace; letter-spacing: .08em; }
  .e { fill: #17202b; font: 11px Consolas, "JetBrains Mono", monospace; }
  .ea { fill: #0b7a6a; font: 500 11px Consolas, "JetBrains Mono", monospace; }
  .edge { fill: none; stroke: #7d8898; stroke-width: 1.5; }
  .edge-dash { fill: none; stroke: #7d8898; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .edge-accent { fill: none; stroke: #0b7a6a; stroke-width: 2.2; }
  .ah { fill: #7d8898; }
  .ah-accent { fill: #0b7a6a; }
</style>
<rect class="bg" x="0" y="0" width="1210" height="760"/>
<defs>
          <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="ah" d="M0,0 L10,5 L0,10 z"/>
          </marker>
          <marker id="arwa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="ah-accent" d="M0,0 L10,5 L0,10 z"/>
          </marker>
        </defs>

        <!-- Windows host -->
        <rect class="panel" x="16" y="16" width="270" height="728" rx="12"/>
        <text class="k" x="36" y="42">WINDOWS 11 HOST</text>

        <rect class="box" x="36" y="56" width="230" height="60" rx="8"/>
        <text class="t" x="52" y="81">PowerShell</text>
        <text class="s" x="52" y="100">kubectl · chaos.ps1 · install.ps1</text>

        <rect class="box-accent" x="36" y="150" width="230" height="74" rx="8"/>
        <text class="t" x="52" y="180">Claude Code</text>
        <text class="s" x="52" y="200">loads .mcp.json at session start</text>

        <rect class="box" x="36" y="360" width="230" height="74" rx="8"/>
        <text class="t" x="52" y="390">Browser</text>
        <text class="s" x="52" y="410">notes app · Grafana · Prometheus</text>

        <!-- Docker Desktop -->
        <rect class="panel" x="300" y="16" width="894" height="728" rx="12"/>
        <text class="k" x="318" y="42">DOCKER DESKTOP (WSL2) · NETWORK "kind"</text>

        <rect class="box-accent" x="316" y="142" width="214" height="90" rx="8"/>
        <text class="t" x="332" y="168">kubernetes-mcp-server</text>
        <text class="s" x="332" y="188">container · read_only = true</text>
        <text class="s" x="332" y="206">core + observability/metrics</text>
        <text class="s" x="332" y="222">19 tools</text>

        <!-- kind cluster -->
        <rect class="group" x="590" y="52" width="590" height="680" rx="10"/>
        <text class="k" x="606" y="74">KIND CLUSTER "ai-debug" · 3 NODES</text>

        <rect class="box" x="610" y="86" width="250" height="118" rx="8"/>
        <text class="t" x="626" y="112">kube-apiserver :6443</text>
        <text class="s" x="626" y="134">SA mcp/mcp-viewer → view +</text>
        <text class="s" x="626" y="151">mcp-cluster-reader</text>
        <text class="s" x="626" y="172">denied: Secrets, exec,</text>
        <text class="s" x="626" y="189">nodes/proxy, all writes</text>

        <rect class="box" x="900" y="100" width="260" height="60" rx="8"/>
        <text class="t" x="916" y="125">metrics-server</text>
        <text class="s" x="916" y="144">serves pods_top · nodes_top</text>

        <rect class="box" x="610" y="360" width="250" height="74" rx="8"/>
        <text class="t" x="626" y="390">Envoy (Contour)</text>
        <text class="s" x="626" y="410">hostPort 80 → localhost:8080</text>

        <!-- demo-app namespace -->
        <rect class="group" x="884" y="250" width="292" height="210" rx="8"/>
        <text class="k" x="896" y="272">NS demo-app</text>
        <rect class="box" x="900" y="284" width="260" height="74" rx="8"/>
        <text class="t" x="916" y="312">notes-app ×2</text>
        <text class="s" x="916" y="332">FastAPI · HPA 2–6 · /metrics</text>
        <rect class="box" x="900" y="390" width="260" height="56" rx="8"/>
        <text class="t" x="916" y="414">redis-0</text>
        <text class="s" x="916" y="432">StatefulSet + 1Gi PVC</text>

        <!-- monitoring namespace -->
        <rect class="group" x="600" y="478" width="576" height="244" rx="8"/>
        <text class="k" x="612" y="500">NS monitoring</text>
        <rect class="box" x="610" y="512" width="250" height="80" rx="8"/>
        <text class="t" x="626" y="540">Prometheus :30090</text>
        <text class="s" x="626" y="560">scrapes every 15s</text>
        <text class="s" x="626" y="577">10 notes-app alert rules</text>
        <rect class="box" x="610" y="630" width="250" height="70" rx="8"/>
        <text class="t" x="626" y="658">Alertmanager :30093</text>
        <text class="s" x="626" y="678">RedisDown, OOMKilled, …</text>
        <rect class="box" x="900" y="512" width="260" height="80" rx="8"/>
        <text class="t" x="916" y="540">Grafana</text>
        <text class="s" x="916" y="560">Notes App dashboard</text>
        <text class="s" x="916" y="577">grafana.localhost:8080</text>
        <rect class="box" x="900" y="630" width="260" height="70" rx="8"/>
        <text class="t" x="916" y="658">kube-state-metrics</text>
        <text class="s" x="916" y="678">node-exporter · kubelet/cAdvisor</text>

        <!-- operator path: kubectl (admin) -->
        <line class="edge-dash" x1="266" y1="86" x2="606" y2="86" marker-end="url(#arw)"/>
        <text class="e" x="320" y="78">kubectl (admin) · 127.0.0.1:62500</text>

        <!-- Claude ↔ MCP: stdio -->
        <line class="edge-accent" x1="266" y1="187" x2="312" y2="187" marker-end="url(#arwa)"/>
        <text class="ea" x="270" y="179">stdio</text>

        <!-- MCP → apiserver -->
        <line class="edge-accent" x1="530" y1="187" x2="606" y2="187" marker-end="url(#arwa)"/>
        <text class="ea" x="536" y="170">HTTPS</text>
        <text class="ea" x="536" y="182">token</text>

        <!-- apiserver → metrics-server -->
        <line class="edge" x1="860" y1="130" x2="896" y2="130" marker-end="url(#arw)"/>

        <!-- MCP → Prometheus (PromQL) -->
        <polyline class="edge-accent" points="470,232 470,545 606,545" marker-end="url(#arwa)"/>
        <text class="ea" x="480" y="537">PromQL :30090</text>

        <!-- MCP → Alertmanager (get_alerts) -->
        <polyline class="edge-accent" points="400,232 400,660 606,660" marker-end="url(#arwa)"/>
        <text class="ea" x="410" y="652">get_alerts :30093</text>

        <!-- Browser → Envoy -->
        <line class="edge" x1="266" y1="397" x2="606" y2="397" marker-end="url(#arw)"/>
        <text class="e" x="486" y="389">:8080 · Host header</text>

        <!-- Envoy → notes-app, Envoy → Grafana -->
        <polyline class="edge" points="860,380 880,380 880,330 896,330" marker-end="url(#arw)"/>
        <polyline class="edge" points="860,420 872,420 872,470 1030,470 1030,508" marker-end="url(#arw)"/>
        <text class="e" x="1040" y="492">grafana.*</text>

        <!-- notes-app → redis -->
        <line class="edge" x1="1030" y1="358" x2="1030" y2="386" marker-end="url(#arw)"/>
        <text class="e" x="1040" y="377">:6379</text>

        <!-- Grafana → Prometheus -->
        <line class="edge" x1="900" y1="552" x2="864" y2="552" marker-end="url(#arw)"/>
        <text class="e" x="866" y="544">query</text>

        <!-- Prometheus scrapes notes-app and exporters -->
        <polyline class="edge-dash" points="845,512 845,452 892,452 892,345 896,345" marker-end="url(#arw)"/>
        <text class="e" x="836" y="494" text-anchor="end">scrapes /metrics</text>
        <polyline class="edge-dash" points="860,580 880,580 880,665 896,665" marker-end="url(#arw)"/>
        <text class="e" x="884" y="620">scrapes</text>

        <!-- Prometheus → Alertmanager -->
        <line class="edge" x1="735" y1="592" x2="735" y2="626" marker-end="url(#arw)"/>
        <text class="e" x="745" y="614">fires</text>
      </svg>
