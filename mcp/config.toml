# kubernetes-mcp-server configuration (https://github.com/containers/kubernetes-mcp-server)
# Reference: docs/configuration.md in that repo.
#
# The server runs from its official container image (Windows Smart App Control
# blocks the unsigned native binary). This file is mounted read-only at
# /etc/kubernetes-mcp-server/config.toml — see .mcp.json at the workspace root.

# Kind-only kubeconfig with the read-only mcp-viewer ServiceAccount
# (generated by mcp/new-mcp-kubeconfig.ps1 and mounted into the container).
# Your ~/.kube/config, including the EKS context, is never mounted.
kubeconfig = "/etc/kubernetes-mcp-server/kubeconfig"
cluster_provider_strategy = "kubeconfig"

# Guardrails (RBAC on the ServiceAccount is the real boundary)
read_only = true          # only tools annotated readOnlyHint=true are registered
# core:                  pods, logs, events, top, nodes, generic resources
# observability/metrics: PromQL queries + alerts from kube-prometheus-stack (Step 6)
toolsets = ["core", "observability/metrics"]
# These need the nodes/proxy permission, which RBAC intentionally withholds
disabled_tools = ["nodes_log", "nodes_stats_summary"]

# Hints for Claude about when to use this server
# (top-level keys must come before any [[table]] in TOML)
server_instructions = """
Use this server to monitor and debug the local kind cluster `ai-debug`.
The demo application lives in namespace `demo-app`: Deployment `notes-app`
(FastAPI, port 8080, probes /healthz and /readyz) backed by StatefulSet `redis`.
Typical workflow: pods_list_in_namespace -> events_list -> pods_log (previous=true
for crashed containers) -> resources_get on the owning Deployment/Service ->
pods_top / nodes_top for resource pressure.
Prometheus (kube-prometheus-stack) is available through the metrics tools: start with
get_alerts to see what is firing (alerts are labelled app=notes-app or app=redis), then
use list_metrics and PromQL queries for history, e.g. restarts
(kube_pod_container_status_restarts_total), OOM kills
(kube_pod_container_status_last_terminated_reason), readiness (kube_pod_status_ready),
app traffic (http_requests_total, http_request_duration_seconds_bucket) and memory
(container_memory_working_set_bytes) in namespace demo-app.
Access is read-only; propose fixes as manifest changes instead of applying them.
"""

[[denied_resources]]
group = ""
version = "v1"
kind = "Secret"

# Prometheus / Alertmanager NodePorts, reached from the MCP container over the
# "kind" Docker network (see monitoring/values.yaml). With read_only = true the
# silence create/update/delete tools are hidden.
[toolset_configs."observability/metrics"]
prometheus_url = "http://ai-debug-control-plane:30090"
alertmanager_url = "http://ai-debug-control-plane:30093"
