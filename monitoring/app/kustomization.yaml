# App-specific monitoring: scrape config, alert rules, Grafana dashboard.
# Apply after kube-prometheus-stack (needs its CRDs):  kubectl apply -k monitoring/app
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podmonitor.yaml
  - alerts.yaml
configMapGenerator:
  - name: notes-app-dashboard
    namespace: monitoring
    files:
      - notes-app-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
