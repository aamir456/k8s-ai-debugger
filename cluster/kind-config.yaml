# kind cluster for the k8s-ai-debugger project
# 1 control-plane + 2 workers so scheduling problems (Pending pods, taints,
# node pressure) can be reproduced realistically.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-debug
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # ingress-nginx will listen on these (Step 3); reach the app at http://localhost:8080
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    labels:
      tier: app
  - role: worker
    labels:
      tier: app
